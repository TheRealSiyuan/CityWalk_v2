<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6dcc0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="CityWalk — walk, run, jump and swing through a storybook London with friends." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6dcc0'/%3E%3Cpath d='M14 27V11l2-6 2 6v16z' fill='%23c9a561'/%3E%3Ccircle cx='16' cy='14' r='2.2' fill='%23fff'/%3E%3C/svg%3E" />
    <title>CityWalk — London</title>
    <style>
      :root {
        --ink: #3a2c25;
        --cream: #fff6e6;
        --paper: rgba(255, 246, 230, 0.92);
        --coral: #e8604c;
        --teal: #2f9c95;
        --gold: #edbb45;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #f6dcc0; color: var(--ink);
        font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none; user-select: none; overscroll-behavior: none; touch-action: none;
      }
      canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #touch { position: fixed; inset: 0; touch-action: none; }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: none; }

      /* joystick */
      #joy-base {
        position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity 0.12s;
      }
      #joy-base.on { opacity: 1; }
      #joy-base::before {
        content: ''; position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%;
        background: rgba(255, 246, 230, 0.2); border: 2.5px solid rgba(255, 246, 230, 0.75);
        box-shadow: 0 2px 10px rgba(58, 44, 37, 0.18);
      }
      #joy-base.run::before { border-color: var(--gold); background: rgba(237, 187, 69, 0.22); }
      #joy-knob {
        position: absolute; left: -27px; top: -27px; width: 54px; height: 54px; border-radius: 50%;
        background: var(--cream); box-shadow: 0 3px 10px rgba(58, 44, 37, 0.35);
      }

      /* action buttons */
      .act {
        position: fixed; border-radius: 50%; display: grid; place-items: center; font-weight: 800; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--cream); box-shadow: 0 5px 0 rgba(58, 44, 37, 0.28), 0 8px 18px rgba(58, 44, 37, 0.25);
        border: 3px solid rgba(255, 246, 230, 0.9); transition: transform 0.06s;
      }
      .act.on { transform: translateY(4px) scale(0.96); box-shadow: 0 1px 0 rgba(58, 44, 37, 0.28); }
      #btn-swing { right: calc(18px + var(--sar)); bottom: calc(34px + var(--sab)); width: 96px; height: 96px; background: var(--coral); font-size: 15px; }
      #btn-jump { right: calc(122px + var(--sar)); bottom: calc(22px + var(--sab)); width: 72px; height: 72px; background: var(--teal); font-size: 13px; }

      /* top bar */
      #top {
        position: fixed; left: calc(10px + var(--sal)); right: calc(10px + var(--sar)); top: calc(10px + var(--sat));
        display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
      }
      .chip {
        pointer-events: auto; background: var(--paper); border-radius: 999px; padding: 9px 14px; font-weight: 800; font-size: 15px;
        box-shadow: 0 3px 0 rgba(58, 44, 37, 0.16), 0 6px 14px rgba(58, 44, 37, 0.14); display: flex; align-items: center; gap: 7px; white-space: nowrap;
      }
      .chip small { font-weight: 700; opacity: 0.6; font-size: 12px; }
      #share { background: var(--ink); color: var(--cream); margin-left: auto; }
      #players .dot { width: 9px; height: 9px; border-radius: 50%; background: #b9ad9c; }
      #players.online .dot { background: #59b86a; }
      #compass {
        position: fixed; left: 50%; top: calc(62px + var(--sat)); transform: translateX(-50%); pointer-events: none;
        font-size: 13px; font-weight: 700; padding: 6px 12px 6px 8px;
      }
      #compass i {
        display: inline-block; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent;
        border-bottom: 15px solid var(--coral); transform-origin: 50% 55%;
      }
      #compass[hidden] { display: none; }

      #reticle {
        position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; opacity: 0;
        border: 3px solid var(--cream); border-radius: 7px; rotate: 45deg; box-shadow: 0 0 0 2px rgba(232, 96, 76, 0.9), 0 0 14px rgba(255, 246, 230, 0.9);
        transition: opacity 0.1s;
      }
      #reticle.on { opacity: 0.95; }

      /* landmark card */
      #card {
        position: fixed; left: 50%; top: calc(104px + var(--sat)); width: min(350px, calc(100vw - 28px));
        transform: translate(-50%, -24px) scale(0.96); opacity: 0; pointer-events: none;
        background: var(--cream); border-radius: 22px; padding: 16px 18px 15px; box-shadow: 0 6px 0 rgba(58, 44, 37, 0.14), 0 16px 34px rgba(58, 44, 37, 0.26);
        transition: transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), opacity 0.25s;
      }
      #card.on { transform: translate(-50%, 0) scale(1); opacity: 1; pointer-events: auto; }
      #card .kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--coral); }
      #card h2 { margin: 3px 0 6px; font-size: 23px; line-height: 1.1; }
      #card p { margin: 0; font-size: 15px; line-height: 1.38; font-weight: 600; opacity: 0.86; }

      #toast {
        position: fixed; left: 50%; bottom: calc(150px + var(--sab)); transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
        background: var(--ink); color: var(--cream); padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px;
        transition: opacity 0.2s, transform 0.2s; white-space: nowrap;
      }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }

      /* tutorial */
      #tutorial {
        position: fixed; left: 50%; top: calc(64px + var(--sat)); transform: translateX(-50%); width: min(330px, calc(100vw - 36px)); text-align: center;
        background: var(--paper); border-radius: 20px; padding: 14px 16px 12px; box-shadow: 0 5px 0 rgba(58, 44, 37, 0.14), 0 12px 28px rgba(58, 44, 37, 0.22);
        pointer-events: none;
      }
      #tutorial[hidden] { display: none; }
      #tut-text { margin: 0 0 9px; font-size: 17px; font-weight: 800; line-height: 1.25; }
      #tut-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
      #tut-dots { display: flex; gap: 6px; }
      #tut-dots b { width: 22px; height: 6px; border-radius: 3px; background: rgba(58, 44, 37, 0.18); overflow: hidden; }
      #tut-dots b.done { background: var(--teal); }
      #tut-dots b.now { background: var(--gold); }
      #tut-skip { pointer-events: auto; background: transparent; font-weight: 800; font-size: 13px; text-decoration: underline; padding: 6px 4px; opacity: 0.7; }
      .ghost { position: fixed; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
      #ghost-move { left: 24vw; bottom: calc(110px + var(--sab)); width: 112px; height: 112px; margin-left: -56px; border-radius: 50%; border: 3px dashed var(--cream); }
      #ghost-move::after { content: ''; position: absolute; left: 31px; top: 31px; width: 44px; height: 44px; border-radius: 50%; background: var(--cream); animation: nudge 1.2s ease-in-out infinite; }
      #ghost-look { right: 14vw; top: 46%; width: 44px; height: 44px; border-radius: 50%; background: var(--cream); animation: sweep 1.3s ease-in-out infinite; }
      body.tut-move #ghost-move, body.tut-look #ghost-look { opacity: 0.85; }
      body.tut-jump #btn-jump, body.tut-swing #btn-swing { animation: pulse 0.8s ease-in-out infinite; }
      @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
      @keyframes sweep { 0%, 100% { transform: translateX(-34px); } 50% { transform: translateX(34px); } }
      @keyframes pulse { 0%, 100% { box-shadow: 0 5px 0 rgba(58, 44, 37, 0.28), 0 0 0 0 rgba(255, 246, 230, 0.9); } 50% { box-shadow: 0 5px 0 rgba(58, 44, 37, 0.28), 0 0 0 16px rgba(255, 246, 230, 0); } }

      /* journal panel */
      #panel {
        position: fixed; inset: 0; background: rgba(58, 44, 37, 0.45); display: grid; place-items: center; padding: 18px; z-index: 5;
      }
      #panel[hidden] { display: none; }
      #panel .sheet {
        width: min(380px, 100%); max-height: 100%; overflow: auto; background: var(--cream); border-radius: 24px; padding: 18px; touch-action: pan-y;
        box-shadow: 0 18px 44px rgba(58, 44, 37, 0.4);
      }
      #panel h3 { margin: 0 0 10px; font-size: 20px; }
      #panel ol { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-weight: 700; font-size: 14px; }
      #panel li { display: flex; align-items: center; gap: 7px; opacity: 0.45; }
      #panel li::before { content: ''; flex: none; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid currentColor; }
      #panel li.found { opacity: 1; }
      #panel li.found::before { background: var(--teal); border-color: var(--teal); }
      #panel label { display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-bottom: 5px; }
      #panel input {
        width: 100%; font: inherit; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(58, 44, 37, 0.2); background: #fff;
        color: var(--ink); -webkit-user-select: text; user-select: text; touch-action: auto;
      }
      #panel .row { display: flex; gap: 8px; margin-top: 14px; }
      #panel .row button { flex: 1; padding: 11px 10px; border-radius: 14px; font-weight: 800; background: rgba(58, 44, 37, 0.1); }
      #panel .row button.primary { background: var(--ink); color: var(--cream); }

      #loading {
        position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#8fc3e6, #f6dcc0 70%); z-index: 9;
        transition: opacity 0.4s; font-weight: 900; font-size: 40px; letter-spacing: -0.02em; color: var(--cream); text-shadow: 0 4px 0 rgba(58, 44, 37, 0.25);
      }
      #loading.gone { opacity: 0; pointer-events: none; }
      @media (min-width: 900px) and (pointer: fine) {
        .act { opacity: 0.55; scale: 0.8; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="reticle"></div>

    <div id="top">
      <button class="chip" id="progress" aria-label="Landmarks found"><span id="count">0/12</span> <small>found</small></button>
      <div class="chip" id="players" title="Players in this room"><span class="dot"></span><span id="pcount">1</span></div>
      <button class="chip" id="share">Share</button>
    </div>
    <div class="chip" id="compass" hidden><i id="needle"></i><span id="compass-text"></span></div>

    <button class="act" id="btn-jump">Jump</button>
    <button class="act" id="btn-swing">Swing</button>

    <div id="card" role="status" aria-live="polite">
      <div class="kicker" id="card-kicker">Landmark found</div>
      <h2 id="card-name"></h2>
      <p id="card-fact"></p>
    </div>
    <div id="toast" role="status"></div>

    <div id="tutorial" hidden>
      <p id="tut-text"></p>
      <div id="tut-row"><div id="tut-dots"></div><button id="tut-skip">Skip</button></div>
    </div>
    <div class="ghost" id="ghost-move"></div>
    <div class="ghost" id="ghost-look"></div>

    <div id="panel" hidden>
      <div class="sheet">
        <h3>London journal</h3>
        <ol id="journal"></ol>
        <label for="name">Your name tag</label>
        <input id="name" maxlength="14" autocomplete="off" />
        <div class="row">
          <button id="mute">Sound: on</button>
          <button id="replay">Replay tutorial</button>
          <button class="primary" id="close">Done</button>
        </div>
      </div>
    </div>

    <div id="loading">CityWalk</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
